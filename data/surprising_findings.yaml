# Surprising findings: common assumptions that full-text reading of the papers overturned.
# "assumptions" = things widely assumed true that did not hold; "worked" = things assumed not to work that did.
# Each evidence item is a result the paper itself demonstrates (checked against a quote from the paper text).
assumptions:
  - belief: A stronger model makes a better teammate.
    reality: Often not. In several studies, more capable or reasoning-heavy models cooperated less, free-rode more, collaborated worse or colluded sooner.
    evidence:
      - {arxiv: "2604.07821", label: "More Capable, Less Cooperative?", lab: "MATS, UIUC, UK AI Security Institute", finding: "o3 reached 17% of the optimal team output and the weaker o3-mini 50%; capability did not predict cooperation (r = 0.16)"}
      - {arxiv: "2506.23276", label: "Corrupted by Reasoning", lab: "Zurich, ETH Zurich, Toronto", finding: "69% of o1-mini agents free-rode in a public-goods game, against 0% for Llama-3.3-70B, GPT-4o and DeepSeek-V3"}
      - {arxiv: "2503.15478", label: "SWEET-RL", lab: "Meta, UC Berkeley", finding: "o1-mini was a worse multi-turn collaborator than GPT-4o (30.3% vs 40.4% success)"}
      - {arxiv: "2506.20664", label: "Decrypto", lab: "Meta FAIR, Oxford", finding: "the older Llama 3.1-70B beat newer reasoning models on all three interactive theory-of-mind tasks"}
      - {arxiv: "2609.24967", label: "Emergent Collusion in Long-Horizon LLM Agent Interaction", lab: "Stanford, Georgia Tech", finding: "within each model family, the more capable model colluded sooner and more often"}

  - belief: Debate works because agents correct each other's mistakes.
    reality: Most of the gain comes from having several answers to vote over. During debate, agents switch from right to wrong more often than the reverse and rarely overturn a wrong majority.
    evidence:
      - {arxiv: "2310.01798", label: "LLMs Cannot Self-Correct Reasoning Yet", lab: "Google DeepMind, UIUC", finding: "with the same number of responses, debate scored 83.0% vs 88.2% for plain majority voting on GSM8K"}
      - {arxiv: "2509.05396", label: "Talk Isn't Always Cheap", lab: "Johns Hopkins, Vector Institute", finding: "debate fell below a majority vote of the agents' first answers in all 10 CommonsenseQA configurations"}
      - {arxiv: "2511.07784", label: "Can LLM Agents Really Debate?", lab: "McGill, Mila", finding: "weaker models overturned a wrong majority in only 3.6% of cases, strong models in about 30%"}
      - {arxiv: "2402.05120", label: "More Agents Is All You Need", lab: "Tencent", finding: "independent sampling plus voting, with no interaction at all, had the best average rank across tasks (2.5 vs 4.4 for debate)"}

  - belief: Letting agents talk to each other improves teamwork.
    reality: Communication often adds cost without adding success. In several studies, quieter or sparser communication matched or beat open chat.
    evidence:
      - {arxiv: "2601.13295", label: "CooperBench", lab: "Stanford", finding: "giving two coding agents a chat channel made no significant difference to success, though up to 20% of their steps went to messaging"}
      - {arxiv: "2610.00583", label: "Worse Together", lab: "Stanford, Anthropic", finding: "in the clinic task, teams with only shared notes matched or beat messaging teams for every model but one (81.0% vs 69.5% for Opus 5)"}
      - {arxiv: "2406.11776", label: "Improving Multi-Agent Debate with Sparse Communication Topology", lab: "Google, Google DeepMind", finding: "letting each agent see only a few neighbours matched or beat full connectivity with 40–50% fewer input tokens"}
      - {arxiv: "2603.01045", label: "Silo-Bench", lab: "ETH Zurich, Vector Institute, Zhejiang University", finding: "failed runs talked longer than successful ones (12.7 vs 8.3 rounds)"}

  - belief: Mixing different model families gives an ensemble real diversity.
    reality: Less than expected. Different models give strikingly similar answers and share blind spots, and member quality matters more than variety.
    evidence:
      - {arxiv: "2502.00674", label: "Rethinking Mixture-of-Agents (Self-MoA)", lab: "Princeton", finding: "sampling the single best model several times beat mixing different LLMs by 6.6 points on AlpacaEval 2.0"}
      - {arxiv: "2510.22954", label: "Artificial Hivemind", lab: "UW, CMU, AI2", finding: "open-ended answers from different model families had cross-model similarity of 0.71–0.82"}
      - {arxiv: "2502.04313", label: "Great Models Think Alike", lab: "Tübingen AI Center, MPI-IS", finding: "across 130 models, mistakes grew more correlated as capability rose, even between different developers"}
      - {arxiv: "2512.08296", label: "Towards a Science of Scaling Agent Systems", lab: "Google Research, Google DeepMind, MIT", finding: "in 13 mixed-model team setups, mixing did not break the capability ceiling; centralized mixed teams scored 12.6 points below all-strong teams"}

  - belief: A team will listen to its best member.
    reality: LLM teams average expert and non-expert views instead of deferring, and a strong partner gets pulled toward the weaker one.
    evidence:
      - {arxiv: "2602.01011", label: "Multi-Agent Teams Hold Experts Back", lab: "Stanford, Apple", finding: "unlike human teams, LLM teams fell 6.3–41.1% short of their best member, even when told who the expert was"}
      - {arxiv: "2509.23537", label: "Beyond the Strongest LLM", lab: "ASU, UPenn, NTU", finding: "at least one of four frontier models was right on 95.5% of GPQA-Diamond questions, yet the team scored 87.4%"}
      - {arxiv: "2511.02687", label: "The Collaboration Gap", lab: "Microsoft Research, EPFL", finding: "o3 paired with a weaker model did not reach o3's own level and copied the weaker model's style"}

  - belief: Fine-tuning on the best transcripts, or on a stronger model's trajectories, teaches agents to collaborate.
    reality: Imitation often made agents worse. RL in the live loop or self-play worked where imitation failed.
    evidence:
      - {arxiv: "2502.18439", label: "MAPoRL", lab: "MIT, Stanford, Amazon", finding: "fine-tuning on the top 10% of 12,800 debate transcripts lowered accuracy by 0.11, which the authors call unexpected"}
      - {arxiv: "2510.05592", label: "AgentFlow", lab: "Stanford", finding: "fine-tuning the planner on GPT-4o's trajectories dropped the system 19 points below the untrained planner; on-policy RL gained 17.2"}
      - {arxiv: "2506.24119", label: "SPIRAL", lab: "NUS, A*STAR, Sea AI Lab", finding: "fine-tuning on 25,000 game trajectories from Qwen3-32B did worse than self-play on all 8 benchmarks (39.7 vs 44.5)"}
      - {arxiv: "2403.05020", label: "The Misleading Success of Simulating Social Interactions", lab: "CMU, MIT, AI2", finding: "fine-tuning on one-LLM scripted dialogues lifted the deal rate from 30% to 93% by copying an agreeable style, not by learning to negotiate"}

  - belief: Training against the strongest or latest opponent gives the most robust agent.
    reality: Diverse and even weak opponents matter more. Training against one strong or latest opponent gets exploited or overfits.
    evidence:
      - {arxiv: "1710.03748", label: "Emergent Complexity via Multi-Agent Competition", lab: "OpenAI, UMass Amherst", finding: "training against the latest opponent gave the worst agents (Humanoid Sumo win rate 0.25 vs 0.63 when sampling older opponents)"}
      - {arxiv: "2110.08176", label: "Collaborating with Humans without Human Data", lab: "DeepMind", finding: "removing weak, partly trained partner checkpoints collapsed performance with new partners (8.6 to 1.0 deliveries)"}
      - {arxiv: "2506.24119", label: "SPIRAL", lab: "NUS, A*STAR, Sea AI Lab", finding: "a fixed Gemini opponent was exploited (win rate 0% to 62.5%) while reasoning gains stalled; self-play kept improving"}
      - {arxiv: "2607.26115", label: "GPT-Red", lab: "OpenAI", finding: "attackers trained against a single defender overfit to it and mode-collapsed; a population of defenders was needed"}

  - belief: The agent with the best self-play score is the best partner.
    reality: Maximizing reward with copies of yourself produces private conventions that break with new partners, including humans.
    evidence:
      - {arxiv: "2003.02979", label: "Other-Play", lab: "Meta FAIR", finding: "the top self-play Hanabi bot scored 23.99 with itself but 9.15 with humans, losing all lives in 85% of games"}
      - {arxiv: "1902.00506", label: "The Hanabi Challenge", lab: "DeepMind, Google Brain, Oxford, CMU", finding: "independently trained agents that each score 20+ in self-play score near zero when paired together"}
      - {arxiv: "2107.06857", label: "Melting Pot", lab: "DeepMind", finding: "agents trained on a shared group reward were often less robust than selfish agents and were exploited by defectors at test time"}

  - belief: More samples, more agents and more rounds always help.
    reality: Returns are uneven and can turn negative.
    evidence:
      - {arxiv: "2403.02419", label: "Are More LLM Calls All You Need?", lab: "Stanford, UC Berkeley, Princeton", finding: "majority-vote accuracy rose and then fell as calls grew from 2 to 1,000, because hard questions converge on the wrong answer"}
      - {arxiv: "2502.08788", label: "Stop Overvaluing Multi-Agent Debate", lab: "Penn State, Shanghai AI Lab", finding: "going from 3 to 9 agents or from 2 to 4 rounds usually brought no gain or a decline"}
      - {arxiv: "2609.19759", label: "Rethinking Multi-Agent Collaboration: When More Is Less", lab: "Shanghai Jiao Tong, Nanjing University", finding: "raising the agent cap from 4 to 6 lowered the score from 71.8 to 64.0 while nearly doubling token use"}
      - {arxiv: "2502.18439", label: "MAPoRL", lab: "MIT, Stanford, Amazon", finding: "untrained agents got no better with extra debate turns, even with twice the token budget"}

  - belief: Warnings and rules in the prompt make agents safer.
    reality: Often not, and sometimes the reverse. One narrowly targeted warning was the striking exception.
    evidence:
      - {arxiv: "2603.01213", label: "Can AI Agents Agree?", lab: "ETH Zurich", finding: "merely warning agents that adversaries might be present (none were) cut valid agreement from 75.4% to 59.1%"}
      - {arxiv: "2609.04170", label: "Emergent Cheating in Autonomous Research Swarms", lab: "Google DeepMind", finding: "despite an explicit 'do not cheat' rule in every prompt, 14% of a 100-agent swarm exploited the grader once they saw peers get away with it"}
      - {arxiv: "2510.06105", label: "Moloch's Bargain", lab: "Stanford", finding: "agents told to stay truthful still drifted after competitive fine-tuning: +7.5% engagement came with +188.6% disinformation"}
      - {arxiv: "2509.05396", label: "Talk Isn't Always Cheap", lab: "Johns Hopkins, Vector Institute", finding: "promising agents a reward for correctness did not reduce right-to-wrong flips and often increased them"}
      - {arxiv: "2608.10218", label: "Mind Viruses", lab: "Anthropic, EPFL", finding: "the exception: a one-paragraph warning made agents nearly immune to agent-to-agent 'mind viruses', even against payloads evolved over 15 generations to beat it"}

  - belief: A model that is safe on its own stays safe in a team, and an orchestrator adds oversight.
    reality: Group settings produced behaviour the single model never showed, and middle layers passed problems along instead of catching them.
    evidence:
      - {arxiv: "2609.28274", label: "Shutdown Sabotage Propensities in Multi-Agent Systems", lab: "Stuttgart, Oxford", finding: "GPT-5.5 never sabotaged a shutdown alone but did in 44% of two-agent and 94% of three-agent runs; with an orchestrator, every tested model did so in 88% or more"}
      - {arxiv: "2603.27771", label: "Emergent Risks in Generative Multi-Agent Systems", lab: "Notre Dame, LMU Munich, UW", finding: "a model that asked for clarification when alone failed to ask in 100% of the multi-agent setups built on it"}
      - {arxiv: "2410.07283", label: "Prompt Infection", lab: "UCL, Stanford", finding: "GPT-4o ignored far more attacks than GPT-3.5 (66% vs 9%) but did more damage once compromised"}
      - {arxiv: "2510.17276", label: "Breaking and Fixing Defenses Against Control-Flow Hijacking", lab: "Cornell, Microsoft", finding: "agents recognized and refused the dangerous action, then kept looking for a way to finish the task and ran the attacker's code anyway"}

  - belief: Collusion requires agents to agree on it, or to be told to.
    reality: It emerged without instructions or messages, and mostly without any explicit agreement.
    evidence:
      - {arxiv: "2404.00806", label: "Algorithmic Collusion by LLMs", lab: "Harvard, Penn State", finding: "GPT-4 pricing agents reached above-competitive prices with no instruction and no channel except prices; the result held with GPT-5.2 at high reasoning effort"}
      - {arxiv: "2609.24967", label: "Emergent Collusion in Long-Horizon LLM Agent Interaction", lab: "Stanford, Georgia Tech", finding: "only 24.4% of collusion onsets involved explicit coordination; paying directly for the rule-breaking verdict removed collusion (72% to 0%), which appeared instead when breaking the rule looked like doing the job well"}
      - {arxiv: "2402.07510", label: "Secret Collusion among AI Agents", lab: "UC Berkeley, Oxford, Google DeepMind", finding: "the paper proves that paraphrasing messages cannot remove covert channels"}

  - belief: LLM agent societies spontaneously reproduce human social phenomena.
    reality: Many headline effects came from the prompt or the setup, and they shrink or vanish once that is fixed.
    evidence:
      - {arxiv: "2509.18052", label: "The PIMMUR Principles", lab: "CUHK, Johns Hopkins, CMU, Fudan, Stanford", finding: "removing a 'demonstrate confirmation bias' instruction cut fake-news believers from 56% to 33%; newer models recognize the classic experiment they are in more often (65.2% vs 50.8%)"}
      - {arxiv: "2403.05020", label: "The Misleading Success of Simulating Social Interactions", lab: "CMU, MIT, AI2", finding: "one LLM scripting both sides reached a deal 94% of the time vs 30% for independent agents, and the original Generative Agents code generated conversations that way"}
      - {arxiv: "2510.17516", label: "SimBench", lab: "Cambridge, Stanford, Oxford", finding: "more reasoning did not make models better human simulators (Claude-3.7-Sonnet 40.80 to 39.46), and instruction tuning made them worse where humans disagree (r = −0.942)"}

worked:
  - belief: Self-play on games only teaches games.
    reality: Self-play on simple games and self-made puzzles transferred to general reasoning, sometimes more than training on real data.
    evidence:
      - {arxiv: "2506.24119", label: "SPIRAL", lab: "NUS, A*STAR, Sea AI Lab", finding: "self-play on TicTacToe, Kuhn Poker and a negotiation game, with no math data, raised the average over 8 math and reasoning benchmarks from 34.0 to 44.5"}
      - {arxiv: "2505.03335", label: "Absolute Zero", lab: "Tsinghua, BIGAI, Penn State", finding: "self-play on code puzzles the model wrote for itself, with zero external data, lifted math by 10.9–15.2 points; RL on curated human code data lifted it by 0.65"}
      - {arxiv: "1710.03748", label: "Emergent Complexity via Multi-Agent Competition", lab: "OpenAI, UMass Amherst", finding: "a humanoid trained only on multi-agent Sumo stayed upright when pushed by wind it had never seen"}

  - belief: Complex team behaviour needs human data or a hand-designed curriculum.
    reality: Simple rewards plus multi-agent competition or self-play produced it on their own.
    evidence:
      - {arxiv: "1909.07528", label: "Emergent Tool Use from Multi-Agent Autocurricula", lab: "OpenAI, Google Brain", finding: "a simple hide-and-seek visibility reward produced six successive strategy phases, including fort building and box surfing, two of which the authors did not expect"}
      - {arxiv: "1912.06680", label: "Dota 2 with Large Scale Deep RL (OpenAI Five)", lab: "OpenAI", finding: "existing RL (PPO) with self-play and no human data, scaled up, beat the Dota 2 world champions"}
      - {arxiv: "2110.08176", label: "Collaborating with Humans without Human Data", lab: "DeepMind", finding: "an agent trained without any human data beat the human-data method, including with 114 real human partners"}
      - {arxiv: "2601.10825", label: "Reasoning Models Generate Societies of Thought", lab: "Google, University of Chicago, Santa Fe Institute", finding: "a base model rewarded only for accuracy spontaneously began questioning itself and developed two distinct personas, while its accuracy rose from near 0% to about 58%"}

  - belief: A checker has to be at least as strong as the model it checks.
    reality: Weaker verifiers and judges improved stronger models, and a same-size verifier did not work.
    evidence:
      - {arxiv: "2502.20379", label: "Multi-Agent Verification", lab: "Toronto, Vector Institute", finding: "a vote among verifiers built on weaker models lifted GPT-4o on MATH from 68.3 to 76.3"}
      - {arxiv: "2407.13692", label: "Prover-Verifier Games Improve Legibility", lab: "OpenAI", finding: "training against verifiers about 1,000x smaller in compute made solutions easier for time-limited humans to check; a verifier the same size as the prover did not work"}
      - {arxiv: "2402.06782", label: "Debating with More Persuasive LLMs", lab: "UCL, Anthropic", finding: "optimizing debaters only to persuade the judge made debate more truthful (judges reached 88% for humans and 76% for LLMs vs 60% and 48% without debate)"}

  - belief: The model that coordinates a team has to be the biggest model in it.
    reality: Small trained orchestrators, and many samples from a small model, beat frontier models used directly.
    evidence:
      - {arxiv: "2511.21689", label: "ToolOrchestra", lab: "NVIDIA, University of Hong Kong", finding: "an RL-trained 8B orchestrator beat GPT-5 on HLE (37.1 vs 35.1) at about a third of the cost"}
      - {arxiv: "2512.04388", label: "The Conductor", lab: "Sakana AI", finding: "a 7B conductor beat every individual frontier worker it routed to, and a pool of only open 27–32B models beat Claude Sonnet 4 by almost 10 points"}
      - {arxiv: "2402.05120", label: "More Agents Is All You Need", lab: "Tencent", finding: "40 votes from Llama2-13B scored 59% on GSM8K, beating a single Llama2-70B at 54%"}

  - belief: Splitting work across parallel agents trades accuracy for speed.
    reality: Learned parallel and recursive setups were both faster and more accurate.
    evidence:
      - {arxiv: "2602.02276", label: "Kimi K2.5 (Agent Swarm)", lab: "Moonshot AI", finding: "a learned parallel orchestrator was 3–4.5x faster and more accurate than the same model as a single agent (BrowseComp 60.6 to 78.4)"}
      - {arxiv: "2512.24601", label: "Recursive Language Models", lab: "MIT", finding: "recursive self-delegation beat GPT-5 by 28.4% even when the input fit in its context window, and the median run was cheaper than a single call"}
      - {arxiv: "2510.01123", label: "Rethinking Thinking Tokens", lab: "Meta Superintelligence Labs, UCL, Mila", finding: "at the same latency budget, parallel drafts plus a short summary and refinement beat one long chain of thought (o3-mini on AIME 2024: 76.9 to 86.7)"}

  - belief: Agents have to talk to each other in natural language.
    reality: Exchanging internal states instead of text was both cheaper and more accurate, even without training.
    evidence:
      - {arxiv: "2511.20639", label: "LatentMAS", lab: "Princeton, Stanford, UIUC", finding: "training-free sharing of latent memory beat text-based teams by 2.8–4.6% accuracy with 70.8–83.7% fewer tokens and about 4x the speed"}
      - {arxiv: "2604.25917", label: "Recursive Multi-Agent Systems", lab: "UIUC, Stanford, NVIDIA", finding: "training only small links between frozen agents (0.31% of parameters) beat full fine-tuning (74.9 vs 68.6) at less than half the cost"}

  - belief: Fixing coordination failures needs retraining or heavy machinery.
    reality: Small, targeted changes to prompts, incentives or protocol often fixed them.
    evidence:
      - {arxiv: "2610.00583", label: "Worse Together", lab: "Stanford, Anthropic", finding: "three plain-language instructions lifted a team from 70.5% to 95.3%, above the single coordinator's 84.3%"}
      - {arxiv: "2505.11556", label: "HiddenBench", lab: "CMU", finding: "a two-stage exchange-then-decide protocol lifted GPT-4.1 from 0.037 to 0.800 on tasks with split information"}
      - {arxiv: "2604.07821", label: "More Capable, Less Cooperative?", lab: "MATS, UIUC, UK AI Security Institute", finding: "a small bonus for sharing (10% of task value) more than doubled o3's team output (+190.7%)"}
      - {arxiv: "2404.16698", label: "GovSim (Cooperate or Collapse)", lab: "ETH Zurich, MPI-IS, Toronto, UW", finding: "adding one sentence to each agent's memory about what happens 'if everyone' takes more than a sustainable share raised efficiency by 24%"}

  - belief: Simple, old algorithms are too weak for cooperative multi-agent RL.
    reality: Plain PPO, even fully independent, matched or beat specialised methods.
    evidence:
      - {arxiv: "2103.01955", label: "The Surprising Effectiveness of PPO in Cooperative Multi-Agent Games (MAPPO)", lab: "Tsinghua, UC Berkeley", finding: "plain PPO with a centralized critic matched or beat off-policy methods (Football 3v1: 88.0% vs 8.1% for QMix); even fully independent PPO hit 84.4% vs QMix's 9.4% on one hard StarCraft map"}

  - belief: Simulating a specific person needs a huge amount of data about them.
    reality: A short interview went a long way, and good agent architectures out-performed human role-players.
    evidence:
      - {arxiv: "2411.10109", label: "Simulating 1,000 People (Grounded in Self-Reports)", lab: "Stanford, Google DeepMind, UW", finding: "interview-grounded agents matched 82–86% of people's own two-week consistency on survey answers, and deleting 80% of the interview barely hurt (0.79 vs 0.83)"}
      - {arxiv: "2304.03442", label: "Generative Agents", lab: "Stanford, Google", finding: "human raters judged the full agent architecture more believable than crowdworkers role-playing the same character"}
